apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lab-api
  namespace: devops-lab
spec:
  ingressClassName: traefik
  rules:
    - host: lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lab-api
                port:
                  number: 80
