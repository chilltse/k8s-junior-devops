apiVersion: batch/v1
kind: Job
metadata:
  name: check-api
  namespace: devops-lab
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: busybox:1.36
          command: ["sh", "-c", "wget -qO- http://lab-api/healthz"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: check-api-periodic
  namespace: devops-lab
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 60
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: check
              image: busybox:1.36
              command: ["sh", "-c", "wget -qO- http://lab-api/healthz"]
